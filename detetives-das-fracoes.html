<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detetives das Frações | Educar no Plural</title>
<style>:root{font-size:16px;--bg:#f6f0df;--ink:#193c35;--card:#fffdf7;--green:#235a4b;--accent:#93492e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,sans-serif}body.high{--bg:#000;--ink:#fff;--card:#111;--green:#333;--accent:#ffdf70}main,header{max-width:840px;margin:auto;padding:22px}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}a{color:var(--ink)}button,input,textarea{font:inherit}button{border:2px solid var(--green);background:var(--green);color:white;padding:12px 18px;border-radius:12px;cursor:pointer}button.alt{background:var(--card);color:var(--ink);border-color:var(--ink)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ed9b26;outline-offset:4px}.panel{background:var(--card);padding:clamp(20px,5vw,42px);border:1px solid #879e91;border-radius:24px;box-shadow:0 12px 35px #0001}h1,h2{font-family:Georgia,serif;line-height:1.12}h1{font-size:clamp(2rem,6vw,3.5rem)}.tag{color:var(--accent);font-weight:bold;letter-spacing:.08em}.choices{display:grid;gap:10px;margin:16px 0}.choices button{text-align:left}progress{width:100%;accent-color:#397f65;height:18px}.visual{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}.piece{width:42px;height:42px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:bold}.filled{background:#b4d8b5;color:#183b30}.actions{display:flex;gap:8px;flex-wrap:wrap}.feedback{min-height:2rem;font-weight:bold}input,textarea{width:100%;padding:12px;background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:8px}footer{text-align:center;padding:24px} [hidden]{display:none!important}</style></head>
<body><header><a href="./index.html">← Educar no Plural</a><div class="actions"><button class="alt" id="minus">A−</button><button class="alt" id="plus">A+</button><button class="alt" id="contrast" aria-pressed="false">Contraste</button><button class="alt" id="listen">Ouvir</button><button class="alt" id="stop">Parar</button></div></header>
<main><div class="panel"><div class="tag">MISSÃO MATEMÁTICA • 5º ANO</div><div id="game"></div></div></main><footer>Fernanda • Educação inclusiva • Adaptação digital das cinco estações</footer>
<script>
const stages=[
{title:'Estação 1 — Material dourado',q:'Uma placa representa 100 unidades. Você encontrou 25 unidades. Que fração da placa elas representam?',opts:['25/100','25/10','100/25'],ans:0,hint:'O denominador indica o total de unidades da placa.',ex:'25 de 100 unidades correspondem a 25/100, ou 1/4.',code:'4',visual:[4,1,'Cada quadrado representa 25 unidades.']},
{title:'Estação 2 — Sistema monetário',q:'Você tem R$ 20,00 e gasta 1/4 desse valor em uma pista. Quanto gastou?',opts:['R$ 4,00','R$ 5,00','R$ 10,00'],ans:1,hint:'Divida 20 em quatro partes iguais.',ex:'20 ÷ 4 = 5. Um quarto de R$ 20 é R$ 5.',code:'7',visual:[4,1,'Cada parte vale R$ 5.']},
{title:'Estação 3 — Pizza de massinha',q:'Uma pizza tem 8 fatias iguais. O grupo comeu 3. Qual fração representa as fatias que sobraram?',opts:['3/8','8/5','5/8'],ans:2,hint:'Subtraia as 3 fatias do total de 8.',ex:'8 − 3 = 5. Sobraram 5/8 da pizza.',code:'2',visual:[8,5,'Cinco fatias restantes de oito.']},
{title:'Estação 4 — Dobraduras',q:'Uma folha foi dobrada em quatro partes iguais e duas foram pintadas. Qual fração é equivalente a 2/4?',opts:['1/2','1/4','2/3'],ans:0,hint:'Compare duas partes de quatro com uma parte de duas.',ex:'2/4 e 1/2 representam a mesma quantidade.',code:'9',visual:[4,2,'Duas partes pintadas de quatro.']},
{title:'Estação 5 — Jogo de frações',q:'Qual carta forma um par equivalente com 0,75?',opts:['1/2','3/4','1/10'],ans:1,hint:'0,75 corresponde a 75 centésimos. Simplifique 75/100.',ex:'75/100 = 3/4.',code:'6',visual:[4,3,'Três partes de quatro representam 0,75.']}];
let i=0,codes=[],size=16,mode='individual';const g=document.getElementById('game');function intro(){g.innerHTML='<h1>Detetives das Frações</h1><p>Um cofre misterioso guarda um segredo. Investigue cinco estações, descubra as pistas e reúna os algarismos para abrir o cofre!</p><p>Você pode jogar sozinho ou em equipe. Use as pistas, converse, desenhe e explique suas estratégias. Não há limite de tempo nem cadastro.</p><div class="actions"><button id="solo">Jogar individualmente</button><button id="team">Jogar em equipe</button></div>';document.getElementById('solo').onclick=()=>{mode='individual';start()};document.getElementById('team').onclick=()=>{mode='equipe';start()}}function start(){i=0;codes=[];show()}function show(){const s=stages[i];g.innerHTML='<p class="tag">ESTAÇÃO '+(i+1)+' DE 5 • '+mode.toUpperCase()+'</p><progress max="5" value="'+i+'" aria-label="Progresso"></progress><p>Pistas conquistadas: '+(codes.join(' · ')||'nenhuma ainda')+'</p><h2>'+s.title+'</h2><p>'+s.q+'</p><button class="alt" id="visualBtn">Ver representação</button><div id="visual" hidden><p>'+s.visual[2]+'</p><div class="visual" role="img" aria-label="'+s.visual[2]+'">'+Array.from({length:s.visual[0]},(_,j)=>'<span aria-hidden="true" class="piece '+(j<s.visual[1]?'filled':'')+'">'+(j<s.visual[1]?'✓':'·')+'</span>').join('')+'</div></div><div class="choices">'+s.opts.map((o,j)=>'<button class="alt" data-j="'+j+'">'+o+'</button>').join('')+'</div><button class="alt" id="hint">Pedir pista</button><p class="feedback" id="feedback" role="status"></p><p><label for="reason">Como você pensou? (opcional, apenas nesta tela)</label><textarea id="reason" rows="2"></textarea></p><button id="next" hidden>Próxima etapa →</button>';const f=document.getElementById('feedback');document.getElementById('visualBtn').onclick=()=>document.getElementById('visual').hidden=false;document.getElementById('hint').onclick=()=>f.textContent=s.hint;g.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{if(+b.dataset.j!==s.ans){f.textContent='Tente novamente. '+s.hint;return}codes.push(s.code);f.textContent='Muito bem! '+s.ex+' Pista: '+s.code+'.';g.querySelectorAll('[data-j]').forEach(x=>x.disabled=true);document.getElementById('next').hidden=false});document.getElementById('next').onclick=()=>{i++;i<5?show():vault();g.querySelector('h2')?.focus()}}function vault(){g.innerHTML='<h2>O cofre dos detetives</h2><progress max="5" value="5"></progress><p>As pistas, em ordem: '+codes.join(' · ')+'</p><form id="vault"><label for="code">Digite os cinco algarismos na ordem das estações:</label><input id="code" inputmode="numeric" maxlength="5" required><button>Abrir cofre</button></form><p role="status" id="feedback"></p>';document.getElementById('vault').onsubmit=e=>{e.preventDefault();if(document.getElementById('code').value!==codes.join('')){document.getElementById('feedback').textContent='Confira a ordem das pistas.';return}g.innerHTML='<h2>🏆 Missão cumprida!</h2><p>Você abriu o cofre! Investigou frações, valores monetários, equivalências e números decimais.</p><p>Compartilhe com o grupo uma estratégia que ajudou você.</p><button id="restart">Jogar novamente</button>';document.getElementById('restart').onclick=intro}}document.getElementById('plus').onclick=()=>{size=Math.min(26,size+2);document.documentElement.style.fontSize=size+'px'};document.getElementById('minus').onclick=()=>{size=Math.max(14,size-2);document.documentElement.style.fontSize=size+'px'};document.getElementById('contrast').onclick=e=>e.target.setAttribute('aria-pressed',document.body.classList.toggle('high'));document.getElementById('listen').onclick=()=>{if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(g.innerText);u.lang='pt-BR';speechSynthesis.speak(u)};document.getElementById('stop').onclick=()=>window.speechSynthesis?.cancel();intro();
</script></body></html>
